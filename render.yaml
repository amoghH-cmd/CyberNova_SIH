services:
  - name: cybernova-backend
    type: web
    runtime: python
    plan: 1c-2g
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./autonomous_soc.db
      # Set this to the frontend's public URL after both services deploy
      # once, e.g. https://cybernova-frontend.onrender.com — Render's
      # fromService only exposes the private-network address, which the
      # browser can't reach, so this has to be the real public origin.
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CONTAMINATION_RATE
        value: "0.08"
      - key: RISK_THRESHOLD
        value: "40"
      - key: KAFKA_BROKERS
        value: localhost:9092
      - key: KAFKA_TOPIC_SECURITY_EVENTS
        value: security-events
      - key: KAFKA_CONSUMER_GROUP
        value: cybernova-blue-team
      - key: KAFKA_PRODUCER_URL
        value: http://localhost:9093

  - name: cybernova-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the backend's public URL after it first deploys,
      # e.g. https://cybernova-backend.onrender.com (no trailing slash).
      # Static sites are pre-built, so a later change here requires
      # triggering a manual redeploy of this service to take effect.
      - key: VITE_API_URL
        sync: false
